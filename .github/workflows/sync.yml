# .github/workflows/sync.yml
name: Sync from GitLab
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - run: |
          git remote add gitlab https://gitgud.io/yeshuang26/shuangcustomassets.git
          git fetch gitlab master

      # 只把 gitlab 那邊的 src/ 內容覆蓋過來，其他檔案（package.json、vite.config.js…）完全不動
      - run: |
          git checkout gitlab/master -- src/
          git status

      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/
          git diff --cached --quiet && echo "No changes" || git commit -m "Sync src/ from GitLab"
          git push origin master
