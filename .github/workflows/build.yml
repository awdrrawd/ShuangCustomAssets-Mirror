# .github/workflows/build.yml
name: Build and Deploy
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master          # 抓 gitgud.io 同步過來的原始碼

      - uses: actions/checkout@v4
        with:
          ref: ci               # 抓你自己維護的 build 設定
          path: ci-config

      - run: cp ci-config/vite.config.js .

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install
      - run: npm run build

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
