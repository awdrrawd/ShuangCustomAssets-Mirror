# .github/workflows/mirror.yml
# 每 3 小時：從 GitLab 整包同步（除了 Mirror 專屬檔案）→ build → 部署到 GitHub Pages
name: Mirror, Build & Deploy

on:
  schedule:
    - cron: '0 */3 * * *'   # 每 3 小時執行一次 (UTC)
  workflow_dispatch:         # 允許手動觸發
  push:
    branches: [master]       # 手動修改 master (例如 .github/、vite.config.js) 時也重新部署

permissions:
  contents: write

concurrency:
  group: mirror-build-deploy
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      # 整包同步 GitLab 的內容，取代先前逐一列舉 src/、package.json… 的白名單寫法。
      # 白名單寫法每次上游新增檔案/資料夾（例如這次的 tests/）都要手動回來補一行，
      # 容易漏；改用 rsync --delete 整包同步 + 黑名單排除「Mirror 專屬、GitLab 沒有」
      # 的檔案，上游增減檔案都會自動反映，不用再維護清單。
      - name: Sync full repo from GitLab (except mirror-only files)
        run: |
          git clone --depth 1 https://gitgud.io/yeshuang26/shuangcustomassets.git /tmp/gitlab-src

          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='vite.config.js' \
            --exclude='node_modules/' \
            --exclude='dist/' \
            /tmp/gitlab-src/ ./

          rm -rf /tmp/gitlab-src

      - name: Commit synced files (if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A -- ':!.github' ':!vite.config.js'
          if git diff --cached --quiet; then
            echo "No changes from GitLab."
          else
            git commit -m "Sync from GitLab"
            git push origin master
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # 注意：npm install 不能帶 NODE_ENV=production，否則會略過 devDependencies
      # (rollup 及其外掛都在 devDependencies)，導致 "rollup: not found"
      - name: Install dependencies
        run: npm install

      - name: Build
        env:
          NODE_ENV: production
        run: npm run build

      - name: Deploy to GitHub Pages (gh-pages branch)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
